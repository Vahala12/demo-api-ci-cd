name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi 1 giờ
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Chạy kịch bản Monitor trực tiếp từ Cloud
        run: |
          postman collection run "59055643-7ce6c0c2-c7f8-48ba-84dc-b94b05455fd5" -e "59055643-55867df5-0a4f-4554-a335-b2ff32c6051c"
